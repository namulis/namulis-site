<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<title>Namulis · Investors</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:wght@400&display=swap" rel="stylesheet">
<style>
  :root { --cream: #F3EEE3; --green: #1E3A2F; --stone: #8A8273; --rule: #CFC6B3; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { background: var(--green); padding: 12px; }
  body {
    min-height: calc(100vh - 24px);
    background: var(--cream);
    color: var(--green);
    font-family: "Libre Baskerville", Baskerville, Georgia, serif;
    font-size: 16px;
    line-height: 1.45;
    -webkit-font-smoothing: antialiased;
    display: flex; align-items: center; justify-content: center;
  }
  .card { width: 100%; max-width: 360px; padding: 0 28px; }
  h1 { font-size: 34px; font-weight: 400; line-height: 1.1; margin-bottom: 1.6em; }
  .sub { color: var(--stone); font-size: 14px; margin-bottom: 2.4em; }
  label { display: block; font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--stone); margin-bottom: 6px; }
  input {
    width: 100%; font: inherit; color: var(--green); background: transparent;
    border: 0; border-bottom: 1px solid var(--rule); border-radius: 0;
    padding: 6px 0 8px; margin-bottom: 1.6em; outline: none;
  }
  input:focus { border-bottom-color: var(--green); }
  button {
    width: 100%; font: inherit; font-size: 15px; letter-spacing: 0.04em;
    color: var(--cream); background: var(--green); border: 0;
    padding: 12px 0; cursor: pointer; margin-top: 0.4em;
  }
  button:hover { background: #172E25; }
  .or { display: flex; align-items: center; gap: 12px; color: var(--stone); font-size: 12px; margin: 1.6em 0; }
  .or::before, .or::after { content: ""; flex: 1; height: 1px; background: var(--rule); }
  .alt { background: transparent; color: var(--green); border: 1px solid var(--rule); }
  .alt:hover { background: transparent; border-color: var(--green); }
  .back { display: inline-block; margin-top: 2.4em; font-size: 13px; color: var(--stone); text-decoration: none; border-bottom: 1px solid transparent; }
  .back:hover { color: var(--green); border-bottom-color: var(--rule); }
  .note { font-size: 12px; color: var(--stone); margin-top: 1.2em; min-height: 1.4em; }
</style>
</head>
<body>
  <main class="card">
    <h1>NAMULIS</h1>

    <form id="f" method="post" action="/investors/login" autocomplete="on">
      <label for="email">Email</label>
      <input id="email" name="email" type="email" autocomplete="username" required>
      <label for="pw">Password</label>
      <input id="pw" name="password" type="password" autocomplete="current-password" required>
      <button type="submit">Sign in</button>
    </form>


    <p class="note" id="note"></p>
    <a class="back" href="/">&larr; namulisholding.com</a>
  </main>
  <script>
    (function () {
      var f = document.getElementById('f'), note = document.getElementById('note'), btn = f.querySelector('button');
      if (/[?&]e=1/.test(location.search)) {
        note.textContent = 'These credentials are not recognised. Access is by invitation only.';
        history.replaceState(null, '', location.pathname);
      }
      // TEMP: Worker route not live yet, so show the refusal instead of posting.
      f.addEventListener('submit', function (e) {
        e.preventDefault();
        btn.disabled = true; btn.textContent = 'Verifying…'; note.textContent = '';
        setTimeout(function () {
          document.getElementById('pw').value = '';
          btn.disabled = false; btn.textContent = 'Sign in';
          note.textContent = 'These credentials are not recognised. Access is by invitation only.';
        }, 1100);
      });
    })();
  </script>
</body>
</html>
